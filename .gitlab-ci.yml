include:
  - project: 'broeskamp/devops/gitlab/gitlab-ci'
    ref: main
    file:
      - '/workflow/workflow.yaml'
      - '/versions/docker-build-container.yaml'
      - '/docker/docker.yaml'

default:
  image: registry.gitlab.com/broeskamp/devops/gitlab/docker-build-container/amazoncorretto:${CORRETTO_VERSION}

variables:
  CORRETTO_JDK_VERSION: 25

stages:
  - build
  - test
  - native
  - image
  - publish
  - release

maven:version:
  stage: .pre
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}-bc"
        ./mvnw org.codehaus.mojo:versions-maven-plugin:2.21.0:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      else
        VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
      fi
      echo "VERSION=$VERSION" > version.env
  artifacts:
    paths:
      - pom.xml
    reports:
      dotenv: version.env

maven:build:
  stage: build
  script:
    - ./mvnw clean package -DskipTests
  artifacts:
    paths:
      - target/classes/
      - target/test-classes/
      - target/quarkus-app/
      - target/floci-*.jar
      - target/quarkus-artifact.properties

maven:test:
  stage: test
  script:
    - ./mvnw surefire:test
  artifacts:
    when: always
    reports:
      junit:
      - target/surefire-reports/TEST-*.xml
    paths:
    - target/surefire-reports/

maven:native:
  stage: native
  image: registry.gitlab.com/broeskamp/devops/gitlab/docker-build-container/amazoncorretto-docker:${CORRETTO_VERSION}
  parallel:
    matrix:
      - RUNNER_TAG: [linux, arm]
  tags:
    - $RUNNER_TAG
  script:
    - |
      set --
      if [ "$RUNNER_TAG" = "linux" ]; then
        set -- -Dquarkus.native.additional-build-args-append=-march=x86-64-v2
      fi
      ./mvnw package \
        -Dnative \
        -Dmaven.compiler.release=25 \
        -Dmaven.main.skip=true \
        -Dmaven.test.skip=true \
        -Dmaven.resources.skip=true \
        -Dquarkus.generate-code.skip=true \
        -Dquarkus.native.remote-container-build=true \
        -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25 \
        "$@"
  artifacts:
    expire_in: 1 day
    paths:
      - target/*-runner
      - target/*.properties
      - target/*.so

.docker:
  stage: image
  image: docker
  parallel:
    matrix:
      - RUNNER_TAG: [linux, arm]
  tags:
    - $RUNNER_TAG
  before_script:
    - !reference [.docker-auth, write]
    - !reference [.docker-auth, registry]

docker:floci:
  extends: .docker
  needs:
    - job: maven:version
      artifacts: true
    - job: maven:native
      parallel:
        matrix:
          - RUNNER_TAG: ['$[[ matrix.RUNNER_TAG ]]']
      artifacts: true
  script:
    - mv target native-artifact
    - mkdir native
    - find native-artifact -maxdepth 1 -type f ! -name '*-runner' -exec cp '{}' native/ \;
    - cp native-artifact/*-runner native/application
    - docker build --file docker/Dockerfile.native-package --build-arg "VERSION=$VERSION" --build-arg TARGETARCH=. --tag "$CI_REGISTRY_IMAGE:tmp-$CI_PIPELINE_ID-$RUNNER_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:tmp-$CI_PIPELINE_ID-$RUNNER_TAG"

docker:floci-compat:
  extends: .docker
  needs:
    - job: maven:version
      artifacts: true
    - job: docker:floci
      parallel:
        matrix:
          - RUNNER_TAG: ['$[[ matrix.RUNNER_TAG ]]']
  script:
    - |
      platform=linux/amd64
      if [ "$RUNNER_TAG" = "arm" ]; then
        platform=linux/arm64
      fi
      builder=$(docker buildx create --use --driver docker-container)
      trap 'docker buildx rm "$builder"' EXIT
      docker buildx build --push --platform "$platform" --build-context "floci/floci:$VERSION=docker-image://$CI_REGISTRY_IMAGE:tmp-$CI_PIPELINE_ID-$RUNNER_TAG" --file docker/Dockerfile.compat --build-arg "VERSION=$VERSION" --tag "$CI_REGISTRY_IMAGE:tmp-$CI_PIPELINE_ID-$RUNNER_TAG-compat" .
      docker run --rm --platform "$platform" "$CI_REGISTRY_IMAGE:tmp-$CI_PIPELINE_ID-$RUNNER_TAG-compat" sh -c 'python3 --version && aws --version && python3 -c "import boto3"'

docker:release:
  stage: publish
  image: docker
  tags:
    - linux
  before_script:
    - !reference [.docker-auth, write]
    - !reference [.docker-auth, registry]
  needs:
    - job: maven:version
      artifacts: true
    - job: docker:floci
    - job: docker:floci-compat
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - docker buildx imagetools create --tag "$CI_REGISTRY_IMAGE:$VERSION" "$CI_REGISTRY_IMAGE:tmp-$CI_PIPELINE_ID-linux" "$CI_REGISTRY_IMAGE:tmp-$CI_PIPELINE_ID-arm"
    - docker buildx imagetools create --tag "$CI_REGISTRY_IMAGE:$VERSION-compat" "$CI_REGISTRY_IMAGE:tmp-$CI_PIPELINE_ID-linux-compat" "$CI_REGISTRY_IMAGE:tmp-$CI_PIPELINE_ID-arm-compat"
    - docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:$VERSION"
    - docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:$VERSION-compat"

gitlab:release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  variables:
    GLAB_CONFIG_DIR: $CI_PROJECT_DIR/.glab-cli
  needs:
    - job: maven:version
      artifacts: true
    - job: docker:release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - echo "Creating GitLab release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $VERSION"
    description: |
      Internal Floci release $VERSION.

      Images:
      - $CI_REGISTRY_IMAGE:$VERSION
      - $CI_REGISTRY_IMAGE:$VERSION-compat
